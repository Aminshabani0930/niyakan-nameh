<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14100c">
  <title>خواندن آفلاین | نیاکان‌نامه</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #14100c; color: #f3e9dc; font: 16px/2 Tahoma, sans-serif; }
    header { position: sticky; top: 0; border-bottom: 1px solid #493a2b; background: #1d1812; padding: 12px 18px; }
    main { max-width: 860px; margin: auto; padding: 20px 16px 70px; }
    a, button { color: #f0c482; }
    button { min-height: 40px; border: 1px solid #76552e; border-radius: 8px; background: #292016; padding: 0 12px; font: inherit; }
    article { margin: 12px 0; border-bottom: 1px solid #493a2b; padding: 14px 0; }
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; direction: rtl; }
    @media (max-width: 560px) { .columns { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <header><a href="/library">بازگشت به کتابخانه</a></header>
  <main id="content"><p>در حال بازکردن نسخه‌ی آفلاین…</p></main>
  <script>
    const database = indexedDB.open("niyakan-nameh-offline", 1);
    database.onupgradeneeded = () => database.result.createObjectStore("sources", { keyPath: "id" });
    database.onsuccess = () => {
      const id = new URLSearchParams(location.search).get("source");
      const request = database.result.transaction("sources").objectStore("sources").get(id);
      request.onsuccess = () => {
        const source = request.result;
        const root = document.getElementById("content");
        if (!source) { root.textContent = "این منبع در این دستگاه ذخیره نشده است."; return; }
        const heading = document.createElement("h1");
        heading.textContent = source.title;
        root.replaceChildren(heading);
        for (const chunk of source.chunks) {
          const section = document.createElement("article");
          const title = document.createElement("h2");
          title.textContent = chunk.title || `بخش ${chunk.sequence}`;
          const text = document.createElement("div");
          text.textContent = chunk.text;
          section.append(title, text);
          root.append(section);
        }
      };
    };
    database.onerror = () => { document.getElementById("content").textContent = "ذخیره‌سازی آفلاین در دسترس نیست."; };
  </script>
</body>
</html>
